name: Test Pull Request

on:
  pull_request:
    paths:
      - 'package.nix'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/**'

jobs:
  test-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Build package
        run: |
          nix build .#atuin --print-build-logs

      - name: Test atuin version
        run: |
          ./result/bin/atuin --version

      - name: Verify package contents
        run: |
          test -f ./result/bin/atuin

      - name: Run basic functionality test
        run: |
          ./result/bin/atuin --help || true
          ./result/bin/atuin --version 2>&1 | grep -i "atuin"
